# Сайт «Тарифы»: nginx принимает запросы и передаёт их Next.js на 127.0.0.1:3000.
# HTTPS сюда допишет certbot — командой tarify https.
server {
    listen 80 default_server;
    server_name __DOMAIN__;

    # Прайсы и фиды покрытия загружаются CSV-файлами.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Адрес посетителя затираем, а не дописываем: приложение берёт первый адрес из
        # X-Forwarded-For для лимитов на вход в админку и заявки, а подставной заголовок
        # обошёл бы их.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Импорт большого прайса идёт дольше минуты.
        proxy_read_timeout 180s;
    }
}
